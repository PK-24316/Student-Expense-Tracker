services:
  - type: web
    name: student-expense-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_HTTPS
        value: "1"
      - key: DATABASE_PATH
        value: /tmp/expenses.db
